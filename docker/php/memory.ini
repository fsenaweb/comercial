; Default da imagem base (php:8.4-fpm) é 128M - suficiente pro dia a dia, mas
; insuficiente pra relatórios que processam o catálogo inteiro de uma vez
; (achado real, 2026-08-24: exportação em PDF/Excel de "Valor do Estoque"
; estourava memória com ~13,4 mil produtos - ver ReportController::buildStockValue()).
; A query já foi otimizada (cursor()/join em vez de get()->with()) e o PDF passou
; a ser gerado em lotes, mas 512M dá folga real de segurança pro pico de
; hidratação + geração de PDF/Excel sem depender só dessas otimizações.
memory_limit = 512M
